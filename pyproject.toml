[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unfiltered-paste-index"
version = "0.1.0"
description = "Modular crawler and indexer for public paste services"
authors = [{ name = "Unfiltered Paste Index", email = "ops@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx[http2]>=0.27.0",
  "tenacity>=8.2.3",
  "structlog>=23.1.0",
  "pydantic>=2.5.0",
  "python-dateutil>=2.9.0",
  "orjson>=3.9.10",
  "lxml>=4.9.0",
  "beautifulsoup4>=4.12.0",
  "readability-lxml>=0.8.1",
  "aiolimiter>=1.1.0",
  "sqlite-utils>=3.35",
  "click>=8.1",
  "jinja2>=3.1.0",
  "defusedxml>=0.7.1",
  "uvloop>=0.19.0; platform_system != 'Windows'",
  "tqdm>=4.66.0"
]

[project.optional-dependencies]
development = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "ruff>=0.4.0",
  "black>=24.3",
  "mypy>=1.8",
  "types-python-dateutil",
  "types-requests"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "A", "C4", "S", "TID", "BLE"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"unfiltered_paste_index/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["."]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "unfiltered_paste_index.models",
  "unfiltered_paste_index.utils.datetime",
  "unfiltered_paste_index.connectors.base",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["unfiltered_paste_index/tests"]
pythonpath = ["."]
