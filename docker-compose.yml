version: "3.9"
services:
  app:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["python", "-m", "unfiltered_paste_index.cli", "--help"]
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
